<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>STELLAR SURVIVOR — 종스크롤 슈팅 로그라이크 MVP</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-wrap">
      <canvas id="game-canvas"></canvas>

      <!-- ===== 가상 조이스틱 (터치한 위치에 표시) ===== -->
      <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>

      <!-- ===== HUD (DOM Overlay) ===== -->
      <div id="hud">
        <div id="hud-top">
          <div id="exp-bar"><div id="exp-fill"></div><span id="exp-label">Lv.1</span></div>
          <div id="hp-bar"><div id="hp-fill"></div><span id="hp-label"></span></div>
          <div id="hud-stats">
            <span id="stat-time">00:00</span>
            <span id="stat-kills">☠ 0</span>
            <span id="stat-score">🏆 0</span>
          </div>
          <div id="boss-bar" class="hidden">
            <div id="boss-fill"></div>
            <span id="boss-label">⚠ DREADNOUGHT</span>
          </div>
        </div>
        <div id="hud-buttons">
          <button id="pause-btn" title="일시정지">⏸</button>
          <button id="mute-btn" title="음소거">🔊</button>
        </div>
        <div id="story-line" class="hidden"></div>
        <div id="combo" class="hidden"></div>
        <div id="slot-tooltip" class="hidden"></div>
        <div id="passive-slots"></div>
        <div id="weapon-slots"></div>
      </div>

      <!-- ===== 레벨업 3선택지 Overlay ===== -->
      <div id="levelup-overlay" class="overlay hidden">
        <h2 class="overlay-title">LEVEL UP!</h2>
        <p class="overlay-sub">강화를 선택하세요</p>
        <div id="card-container"></div>
      </div>

      <!-- ===== 게임오버 Overlay ===== -->
      <div id="gameover-overlay" class="overlay hidden">
        <h2 class="overlay-title danger">GAME OVER</h2>
        <div id="gameover-stats"></div>
        <button id="restart-btn">다시 도전</button>
      </div>

      <!-- ===== 승리 Overlay ===== -->
      <div id="victory-overlay" class="overlay hidden">
        <h2 class="overlay-title">MISSION CLEAR!</h2>
        <div id="victory-stats"></div>
        <button id="victory-restart-btn">다시 도전</button>
      </div>

      <!-- ===== 일시정지 Overlay ===== -->
      <div id="pause-overlay" class="overlay hidden">
        <h2 class="overlay-title">PAUSED</h2>
        <button id="resume-btn">계속하기</button>
        <button id="pause-restart-btn" class="secondary">다시 시작</button>
      </div>

      <!-- ===== 시작 / 격납고 Overlay ===== -->
      <div id="start-overlay" class="overlay">
        <h1 class="overlay-title">STELLAR<br/>SURVIVOR</h1>
        <p class="overlay-sub">스테이지·도전·기체를 고르고 출격하세요.<br/>이전 스테이지 클리어로 다음 전선이 열립니다.</p>
        <div id="meta-bar">💰 <span id="meta-credits">0</span> · <span id="meta-stats"></span></div>
        <div class="hangar-label">스테이지</div>
        <div id="stage-select" class="chip-row"></div>
        <div class="hangar-label">도전 모드</div>
        <div id="challenge-select" class="chip-row"></div>
        <div class="hangar-label">기체</div>
        <div id="ship-select"></div>
        <div class="hangar-actions">
          <button id="start-btn">출격</button>
          <button id="meta-btn" class="secondary">영구 강화</button>
          <button id="achv-btn" class="secondary">업적</button>
        </div>
      </div>

      <!-- ===== 메타 상점 ===== -->
      <div id="meta-overlay" class="overlay hidden">
        <h2 class="overlay-title">HANGAR</h2>
        <p class="overlay-sub">런 간 영구 업그레이드 · 💰 <span id="meta-shop-credits">0</span></p>
        <div id="meta-shop"></div>
        <button id="meta-close-btn" class="secondary">닫기</button>
      </div>

      <!-- ===== 업적 ===== -->
      <div id="achv-overlay" class="overlay hidden">
        <h2 class="overlay-title">ACHIEVEMENTS</h2>
        <div id="achv-list"></div>
        <button id="achv-close-btn" class="secondary">닫기</button>
      </div>

      <!-- 알림 배너: 격납고/상점 오버레이보다 위 -->
      <div id="banner" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
